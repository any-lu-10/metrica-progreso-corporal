services:
  - type: web
    runtime: static
    name: metrica-progreso-corporal-app
    rootDir: metrica-render
    buildCommand: npm ci --prefix firebase-app && ln -s firebase-app/node_modules node_modules && npm run build --prefix firebase-app
    staticPublishPath: ./firebase-app/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache

